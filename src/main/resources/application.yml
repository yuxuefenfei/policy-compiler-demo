spring:
  datasource:
    url: jdbc:h2:mem:policies;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update # 演示环境。生产应使用 Flyway/Liquibase 迁移，禁止 update
    open-in-view: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
